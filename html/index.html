<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Threadfin</title>
  <!-- font-awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.14.0/css/all.min.css"
  />
  <!-- Google Material Icons -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-gH2yIJqKdNHPEq0n4Mqa/HGKIhSkIHeL5AyhkYV8i59U5AR6csBvApHHNl/vI1Bx" crossorigin="anonymous">
  <link rel="stylesheet" href="css/screen.css" type="text/css">
  <link rel="stylesheet" href="css/base.css" type="text/css">
  <link rel="icon" href="img/threadfin.ico">

</head>

<body>

  <div id="loading" class="modal fade" role="status" aria-label="Loading">
    <div class="modal-dialog loader"></div>
  </div>

  <div id="popup" class="modal fade" role="dialog" aria-label="Details">
    <div class="modal-dialog modal-xl">
      <div class="modal-content">
        <div class="modal-header" id="popup_header"></div>
        <div class="modal-body">
          <div class="container-fluid">
            <div class="row">
              <div id="popup-custom"></div>
            </div>
          </div>
        </div>
        <div class="modal-footer" id="popup_footer"></div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="server_information" role="dialog" aria-label="Server Information">
    <div class="modal-dialog modal-xl">
      <div class="modal-content">
        <div class="modal-header">
          <h3 class="modal-title">{{.status.serverInformation}}</h3>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="container-fluid">
            <div class="row">
              <div class="card text-bg-dark mb-3">
                <div class="card-header">{{.status.serverInformation}}</div>
                <div class="card-body">
                  <label for="version" class="form-label">Threadfin Version</label>
                  <input type="text" class="form-control" id="version" aria-describedby="basic-addon3" readonly disabled>
                  <label for="branch" class="form-label">Threadfin Branch</label>
                  <input type="text" class="form-control" id="branch" aria-describedby="basic-addon3" readonly disabled>
                  <label for="errors" class="form-label">Errors</label>
                  <input type="text" class="form-control" id="errors" aria-describedby="basic-addon3" readonly disabled>
                  <label for="warnings" class="form-label">Warnings</label>
                  <input type="text" class="form-control" id="warnings" aria-describedby="basic-addon3" readonly disabled>
                </div>
              </div>
              <div class="card text-bg-dark mb-3">
                <div class="card-header">{{.status.streamInformation}}</div>
                <div class="card-body">
                  <label for="DVR" class="form-label">DVR IP</label>
                  <input type="text" class="form-control" id="DVR" aria-describedby="basic-addon3" readonly disabled>
                  <label for="m3u-url" class="form-label">M3U URL (Specific groups: [http://...?group-title=foo,bar])</label>
                  <div class="input-group">
                    <input type="text" class="form-control" id="m3u-url" aria-describedby="basic-addon3" readonly>
                    <button class="input-group-text copy-btn" data-clipboard-target="#m3u-url" data-bs-title="Copy to clipboard" data-bs-toggle="tooltip" data-bs-placement="bottom"><span class="material-symbols-outlined" style="font-size:18px;">content_copy</span></button>
                  </div>
                  <label for="xepg-url" class="form-label">XMLTV URL</label>
                  <div class="input-group">
                    <input type="text" class="form-control" id="xepg-url" aria-describedby="basic-addon3" readonly>
                    <button class="input-group-text copy-btn" data-clipboard-target="#xepg-url" data-bs-title="Copy to clipboard" data-bs-toggle="tooltip" data-bs-placement="bottom"><span class="material-symbols-outlined" style="font-size:18px;">content_copy</span></button>
                  </div>
                  <label for="streams" class="form-label">{{.status.filteredChannels}}</label>
                  <input type="text" class="form-control" id="streams" aria-describedby="basic-addon3" readonly disabled>
                  <label for="xepg" class="form-label">{{.status.mappedChannels}}</label>
                  <input type="text" class="form-control" id="xepg" aria-describedby="basic-addon3" readonly disabled>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <nav class="navbar navbar-expand-lg sticky-top navbar-dark bg-black" role="navigation" aria-label="Main navigation">
    <div class="container-fluid">
      <a class="navbar-brand" href="/web">
        <span id="logo"></span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav mx-auto mb-2 mb-lg-0" id="main-menu" aria-label="Main menu">
        </ul>
        <div class="col-md-2 col-sm-2">
          <p id="playlist-connection-information">
          </p>
          <p id="client-connection-information">
          </p>
        </div>
        <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
          <li class="nav-link" data-bs-toggle="modal" data-bs-target="#server_information"><span class="material-symbols-outlined" style="font-size:18px;vertical-align:middle;margin-right:4px;">info</span>{{.status.serverInformation}}</li>
        </ul>
      </div>
    </div>
  </nav>
  <div class="container-flex">
    <div class="row">
      <div class="col-md-12 col-sm-12">
        <div id="content" role="main"></div>
      </div>
    </div>
    <div id="myStreamsBox" class="notVisible"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-A3rJD856KowSb7dwlZdYEkO39Gagi7vIsF0jrRAoQmDKKtQBHUuLZ9AsSv4jD4Xa" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/clipboard.js/2.0.10/clipboard.min.js" defer></script>
  <script type="text/javascript" src="js/network_ts.js" defer></script>
  <script type="text/javascript" src="js/menu_ts.js" defer></script>
  <script type="text/javascript" src="js/settings_ts.js" defer></script>
  <script type="text/javascript" src="js/logs_ts.js" defer></script>
  <script type="text/javascript" src="js/base_ts.js" defer></script>
</body>

</html>
